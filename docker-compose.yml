version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─────────────────────────────────────────────
  # API Gateway (FastAPI)
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: voice_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TELNYX_API_KEY=${TELNYX_API_KEY}
      - TELNYX_PUBLIC_KEY=${TELNYX_PUBLIC_KEY}
      - TELNYX_APP_ID=${TELNYX_APP_ID}
      - BASE_URL=${BASE_URL}
      - STT_URL=http://stt:8001
      - LLM_URL=http://llm:8002
      - TTS_URL=http://tts:8003
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://voice:voice@postgres:5432/voicedb
      - AUDIO_DIR=/audio
      - LOG_LEVEL=INFO
    volumes:
      - audio_files:/audio
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stt:
        condition: service_started
      llm:
        condition: service_started
      tts:
        condition: service_started
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # STT Service (faster-whisper)
  # ─────────────────────────────────────────────
  stt:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    container_name: voice_stt
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - LOG_LEVEL=INFO
    volumes:
      - whisper_models:/root/.cache/huggingface
      - audio_files:/audio
    networks:
      - voice_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  # ─────────────────────────────────────────────
  # LLM Service (Google Gemini API)
  # No local model — pure API call, ~200-400ms latency
  # ─────────────────────────────────────────────
  llm:
    build:
      context: ./services/llm
      dockerfile: Dockerfile
    container_name: voice_llm
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - MAX_TOKENS=${MAX_TOKENS:-150}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - LOG_LEVEL=INFO
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # TTS Service (Piper)
  # ─────────────────────────────────────────────
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    container_name: voice_tts
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PIPER_MODEL=${PIPER_MODEL:-en_US-lessac-medium}
      - AUDIO_DIR=/audio
      - LOG_LEVEL=INFO
    volumes:
      - audio_files:/audio
      - piper_models:/models
    networks:
      - voice_net
    logging: *default-logging

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: voice_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=voice
      - POSTGRES_PASSWORD=voice
      - POSTGRES_DB=voicedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voicedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voice_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Nginx (reverse proxy + audio file server)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: voice_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - audio_files:/audio:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - voice_net
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  audio_files:
  whisper_models:
  piper_models:
  # ollama_models volume removed — no local LLM

networks:
  voice_net:
    driver: bridge
