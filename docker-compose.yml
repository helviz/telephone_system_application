version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─────────────────────────────────────────────
  # API Gateway (FastAPI)
  # Handles Twilio webhooks, orchestrates STT → LLM → TTS pipeline.
  # Twilio webhooks hit POST /call/incoming  (TwiML voice response)
  # Twilio Media Streams hit WS  /stream/{call_sid}
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: voice_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ── Twilio credentials ──────────────────
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      # ── Twilio webhook validation ───────────
      # Set to "true" in production to validate X-Twilio-Signature headers
      - TWILIO_VALIDATE_SIGNATURE=${TWILIO_VALIDATE_SIGNATURE:-true}
      # ── Service mesh ────────────────────────
      - BASE_URL=${BASE_URL}                        # e.g. https://your-domain.com
      - STT_URL=http://stt:8001
      - LLM_URL=http://llm:8002
      - TTS_URL=http://tts:8003
      - REDIS_URL=redis://redis:6379/0
      # ── Database ────────────────────────────
      # Points to the local postgres service (overrides any Supabase URL)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-voicedb}
      - AUDIO_DIR=/audio
      - LOG_LEVEL=INFO
    volumes:
      - audio_files:/audio
      - ./logs:/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      stt:
        condition: service_started
      llm:
        condition: service_started
      tts:
        condition: service_started
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # STT Service (faster-whisper + Silero VAD)
  # Exposes:
  #   POST /transcribe        — full-file transcription
  #   POST /transcribe_vad    — VAD-segmented transcription
  #   WS   /stream/{call_sid} — Twilio Media Stream WebSocket
  #
  # Twilio Media Streams send mulaw 8kHz audio — the STT service
  # must resample to 16kHz before passing to Whisper.
  # VAD detects end-of-speech, cutting latency vs waiting for Twilio
  # to hang up or hit a silence timeout on its own.
  # ─────────────────────────────────────────────
  stt:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    container_name: voice_stt
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      # ── VAD settings ──────────────────────────
      # 0.8 s silence = end of turn; tune down to 0.5 s for snappier feel
      - VAD_SILENCE_THRESHOLD_S=${VAD_SILENCE_THRESHOLD_S:-0.8}
      - VAD_MIN_SPEECH_DURATION_S=${VAD_MIN_SPEECH_DURATION_S:-0.3}
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.5}
      - VAD_CHUNK_MS=${VAD_CHUNK_MS:-32}
      # ── Twilio audio format ───────────────────
      # Twilio Media Streams deliver mulaw 8kHz; resample to 16kHz for Whisper
      - TWILIO_AUDIO_ENCODING=mulaw
      - TWILIO_SAMPLE_RATE=8000
      - WHISPER_SAMPLE_RATE=16000
    volumes:
      - whisper_models:/root/.cache/huggingface
      - audio_files:/audio
    networks:
      - voice_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  # ─────────────────────────────────────────────
  # LLM Service (Google Gemini API)
  # No local model — pure API call, ~200-400 ms latency.
  # Keep MAX_TOKENS low (≤150) so TTS starts fast and
  # Twilio's 5-second TwiML response deadline is not hit.
  # ─────────────────────────────────────────────
  llm:
    build:
      context: ./services/llm
      dockerfile: Dockerfile
    container_name: voice_llm
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - MAX_TOKENS=${MAX_TOKENS:-150}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - LOG_LEVEL=INFO
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # TTS Service (Piper)
  # Generates audio files served by Nginx.
  # The API returns a TwiML <Play> pointing at
  # https://${BASE_URL}/audio/<file>.wav so Twilio
  # fetches and streams it to the caller.
  # ─────────────────────────────────────────────
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    container_name: voice_tts
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PIPER_MODEL=${PIPER_MODEL:-en_US-lessac-medium}
      - AUDIO_DIR=/audio
      - LOG_LEVEL=INFO
    volumes:
      - audio_files:/audio
      - piper_models:/models
    networks:
      - voice_net
    logging: *default-logging

  # ─────────────────────────────────────────────
  # PostgreSQL 16
  # Stores call records, transcripts, and agent sessions.
  #
  # Suggested schema (run via Alembic or init SQL):
  #   calls        (call_sid PK, from_number, to_number, status, started_at, ended_at)
  #   transcripts  (id PK, call_sid FK, role, text, created_at)
  #   sessions     (call_sid PK, context JSONB, updated_at)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: voice_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-voice}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}        # required — set in ..env.example
      - POSTGRES_DB=${POSTGRES_DB:-voicedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Drop .sql or .sh init scripts here and they run on first boot
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voice} -d ${POSTGRES_DB:-voicedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # ─────────────────────────────────────────────
  # Redis  (session state, call context cache,
  #         transcript pub/sub channel)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voice_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - voice_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Nginx (reverse proxy + audio file server)
  # ── Critical for Twilio ──────────────────────
  # • Must proxy WebSocket upgrades for /stream/* so Twilio
  #   Media Streams can connect (Upgrade: websocket header).
  # • /audio/ must be publicly reachable over HTTPS because
  #   Twilio fetches <Play> URLs from its own servers, not
  #   from inside your network.
  # • TLS cert is mandatory — Twilio rejects plain HTTP <Play>.
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: voice_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - audio_files:/audio:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - voice_net
    logging: *default-logging

volumes:
  redis_data:
  postgres_data:
  audio_files:
  whisper_models:
  piper_models:

networks:
  voice_net:
    driver: bridge